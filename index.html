<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManiaLiveDan</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=0.8.0" />
</head>

<body>
    <div class="stage" id="stage">
    <svg class="card-glow" id="card-glow-a" viewBox="0 0 520 170" preserveAspectRatio="none" aria-hidden="true"></svg>
    <svg class="card-glow" id="card-glow-b" viewBox="0 0 520 170" preserveAspectRatio="none" aria-hidden="true"></svg>
    <main class="card" id="card">
        <header class="row head">
            <span class="dot" id="dot" title="tosu connection status"></span>
            <span class="status" id="status">Waiting for beatmap…</span>
            <span class="caption" id="caption">Current</span>
            <span class="spacer"></span>
            <span class="sub" id="sub"></span>
            <span class="star-tag"><span id="star">--</span><em>★</em></span>
            <span class="tag" id="keys" hidden>4K</span>
            <span class="tag tag-mods" id="mods" hidden>DT 1.50x</span>
            <span class="tag tag-algo" id="algo" title="Algorithm used for the current dan">Sunny</span>
        </header>

        <section class="row main">
            <div class="dan-block rc-block" id="rc-block">
                <div class="block-name" id="rc-block-name">RC DAN</div>
                <div class="dan-line">
                    <span class="dan-prefix" id="rc-prefix"></span>
                    <span class="dan" id="dan">--</span>
                    <span class="tier" id="tier"></span>
                </div>
            </div>

            <div class="dan-block ln-block" id="ln-block" hidden>
                <div class="block-name" id="ln-block-name">LN DAN</div>
                <div class="dan-line">
                    <span class="dan-prefix" id="ln-prefix">LN</span>
                    <span class="dan" id="ln">--</span>
                    <span class="tier" id="ln-tier"></span>
                </div>
            </div>
        </section>
    </main>
    </div>

    <script type="module" src="index.js?v=0.8.0"></script>
</body>

</html>
